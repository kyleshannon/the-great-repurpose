<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="tgr-fallback-title tgr-fallback-desc">
  <title id="tgr-fallback-title">The Great Repurpose — Daily Signal</title>
  <desc id="tgr-fallback-desc">Branded fallback thumbnail used when a Daily Signal story has no image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2233"/>
      <stop offset="100%" stop-color="#081626"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#bg)"/>
  <!-- constellation dots -->
  <g fill="#F5EFE0" opacity="0.55">
    <circle cx="48"  cy="44"  r="1.4"/>
    <circle cx="92"  cy="78"  r="1"/>
    <circle cx="140" cy="36"  r="1.2"/>
    <circle cx="200" cy="62"  r="0.9"/>
    <circle cx="300" cy="48"  r="1.3"/>
    <circle cx="372" cy="74"  r="1"/>
    <circle cx="420" cy="40"  r="1.1"/>
    <circle cx="64"  cy="212" r="1.1"/>
    <circle cx="148" cy="232" r="0.9"/>
    <circle cx="248" cy="220" r="1.3"/>
    <circle cx="336" cy="240" r="1"/>
    <circle cx="412" cy="216" r="1.2"/>
  </g>
  <g fill="#E07A5F">
    <circle cx="116" cy="58"  r="1.8"/>
    <circle cx="362" cy="222" r="1.8"/>
  </g>
  <!-- coral connector line -->
  <line x1="120" y1="135" x2="360" y2="135" stroke="#E07A5F" stroke-width="1" opacity="0.6"/>
  <circle cx="120" cy="135" r="2.5" fill="#E07A5F"/>
  <circle cx="360" cy="135" r="2.5" fill="#E07A5F"/>
  <!-- eyebrow -->
  <text x="240" y="118"
        text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="11"
        letter-spacing="4"
        fill="#E07A5F"
        font-weight="600">THE GREAT REPURPOSE</text>
  <!-- wordmark -->
  <text x="240" y="172"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="42"
        fill="#F5EFE0"
        font-style="italic">Daily Signal</text>
  <!-- footer label -->
  <text x="240" y="208"
        text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="10"
        letter-spacing="3"
        fill="#F5EFE0"
        opacity="0.55">FIVE STORIES · ONE PATTERN</text>
</svg>
